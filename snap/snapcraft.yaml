name: maat
title: maat
base: core24
adopt-info: maat
license: GPL-3.0-only
summary: Confined, auditable system diagnostics for AI agents
description: |
  maat exposes read-only Ubuntu diagnostics (journal, systemd units, processes,
  filesystems, AppArmor denials, network interface counters) to AI agents over
  the Model Context Protocol, with the limits enforced by snap confinement
  rather than by the model's good behaviour. It records typed, reviewable plans that a human applies
  with the separate, unconfined maatctl tool after authorizing them through
  polkit.

  This is a development preview. The server is strictly confined and plugs only
  read-oriented interfaces; it has no network access.

grade: devel
confinement: strict
icon: docs/assets/maat-icon.svg

apps:
  maat:
    command: bin/maat
    # Read-oriented interfaces only, and deliberately NOT network-observe:
    # testing showed network-observe permits outbound AF_INET connections, which
    # would give a hijacked model an exfiltration channel. Dropping it keeps the
    # no-egress guarantee; the network collector fails closed under this profile.
    # There is likewise no `network` plug. All three are manual-connect.
    plugs:
      - log-observe
      - system-observe
      - mount-observe

parts:
  maat:
    plugin: go
    source: .
    build-snaps:
      - go/stable
    # The release workflow writes the tag's version to VERSION; any other build
    # is a dev build.
    override-pull: |
      craftctl default
      craftctl set version="$(cat "$CRAFT_PART_SRC/VERSION" 2>/dev/null || echo "0.0.1-dev+$(git -C "$CRAFT_PART_SRC" rev-parse --short HEAD 2>/dev/null || echo local)")"
    build-environment:
      - CGO_ENABLED: "0"
    # Build only the confined server, stamped with the snap's version so that
    # `maat version` and the MCP server's version match `snap list`. maatctl is
    # unconfined and distributed separately; the benchmark harness is a
    # developer tool. No iproute2: under this profile `ip` cannot read links or
    # routes (that needs network-observe), so network_state uses /proc/net/dev.
    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      go build -trimpath -ldflags "-X main.version=$(craftctl get version)" -o "$CRAFT_PART_INSTALL/bin/maat" ./cmd/maat
